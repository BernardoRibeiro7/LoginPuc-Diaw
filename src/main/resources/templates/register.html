<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Lumen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="auth-page">

    <section class="visual">

        <div class="grid"></div>
        <div class="shape-one"></div>
        <div class="shape-two"></div>

        <div class="logo">
            <div class="logo-symbol"></div>
            LUMEN
        </div>

        <div class="visual-copy">

            <div class="eyebrow">Novo usuário</div>

            <h2>
                Sua conta.<br>
                Seu espaço.
            </h2>

            <p>
                Cadastre seus dados e tenha acesso à plataforma
                de maneira segura.
            </p>

        </div>

        <div class="visual-footer">
            Simples por fora. Seguro por dentro.
        </div>

    </section>

    <section class="form-area">

        <div class="form-box">

            <div class="form-top">
                <span class="tag">Cadastro</span>
                <h1>Crie sua conta.</h1>
                <p>Leva menos de um minuto.</p>
            </div>

            <form
                th:action="@{/register}"
                th:object="${registerForm}"
                method="post">

                <div class="field">
                    <label>Nome de usuário</label>

                    <input
                        type="text"
                        th:field="*{username}"
                        placeholder="Escolha um usuário">

                    <span
                        class="field-error"
                        th:if="${#fields.hasErrors('username')}"
                        th:errors="*{username}">
                    </span>
                </div>

                <div class="field">
                    <label>Email</label>

                    <input
                        type="email"
                        th:field="*{email}"
                        placeholder="exemplo@email.com">

                    <span
                        class="field-error"
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}">
                    </span>
                </div>

                <div class="field">
                    <label>Senha</label>

                    <input
                        type="password"
                        th:field="*{password}"
                        placeholder="Pelo menos 6 caracteres">

                    <span
                        class="field-error"
                        th:if="${#fields.hasErrors('password')}"
                        th:errors="*{password}">
                    </span>
                </div>

                <div class="field">
                    <label>Confirmar senha</label>

                    <input
                        type="password"
                        th:field="*{confirmPassword}"
                        placeholder="Repita sua senha">

                    <span
                        class="field-error"
                        th:if="${#fields.hasErrors('confirmPassword')}"
                        th:errors="*{confirmPassword}">
                    </span>
                </div>

                <button class="primary-button" type="submit">
                    Criar conta
                </button>

            </form>

            <div class="secondary-links">
                Já possui uma conta?
                <a th:href="@{/login}">
                    Fazer login
                </a>
            </div>

        </div>

    </section>

</main>

</body>
</html>
