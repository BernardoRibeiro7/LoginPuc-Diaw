<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>

    <h1>Entrar</h1>

    <p th:if="${param.error}">
        Usuário, email ou senha inválidos.
    </p>

    <p th:if="${param.logout}">
        Sessão encerrada com sucesso.
    </p>

    <p th:if="${param.registered}">
        Cadastro realizado com sucesso. Faça seu login.
    </p>

    <form th:action="@{/login}" method="post">

        <div>
            <label>Usuário ou email</label>
            <input
                type="text"
                name="username"
                required>
        </div>

        <div>
            <label>Senha</label>
            <input
                type="password"
                name="password"
                required>
        </div>

        <button type="submit">Entrar</button>

    </form>

    <a th:href="@{/register}">
        Criar conta
    </a>

    <br>

    <a th:href="@{/recoverpassword}">
        Esqueci minha senha
    </a>

</body>
</html>
