<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar acesso | Lumen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<main class="auth-page">

    <section class="visual">

        <div class="grid"></div>
        <div class="shape-one"></div>
        <div class="shape-two"></div>

        <div class="logo">
            <div class="logo-symbol"></div>
            LUMEN
        </div>

        <div class="visual-copy">

            <div class="eyebrow">Recuperação</div>

            <h2>
                Volte para<br>
                sua conta.
            </h2>

            <p>
                Informe seu email cadastrado para iniciar
                a recuperação do acesso.
            </p>

        </div>

        <div class="visual-footer">
            Seu acesso continua protegido.
        </div>

    </section>

    <section class="form-area">

        <div class="form-box">

            <div class="form-top">
                <span class="tag">Recuperação</span>
                <h1>Esqueceu a senha?</h1>
                <p>Digite abaixo o email utilizado no seu cadastro.</p>
            </div>

            <div
                class="message error"
                th:if="${error}"
                th:text="${error}">
            </div>

            <div
                class="message success"
                th:if="${success}"
                th:text="${success}">
            </div>

            <form th:action="@{/recoverpassword}" method="post">

                <div class="field">

                    <label>Email cadastrado</label>

                    <input
                        name="email"
                        type="email"
                        placeholder="exemplo@email.com"
                        required>

                </div>

                <button class="primary-button" type="submit">
                    Solicitar recuperação
                </button>

            </form>

            <div class="secondary-links">
                <a th:href="@{/login}">
                    Voltar para o login
                </a>
            </div>

        </div>

    </section>

</main>

</body>
</html>
