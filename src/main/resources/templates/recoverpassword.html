<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | Nexus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page">

    <section class="brand-side">

        <div class="logo">
            <div class="logo-mark"></div>
            NEXUS
        </div>

        <div class="brand-content">
            <h2>Recupere<br>seu acesso.</h2>

            <p>
                Informe o email cadastrado para solicitar
                a recuperação da sua conta.
            </p>
        </div>

        <div class="brand-footer">
            Autenticação segura • Spring Boot
        </div>

    </section>

    <section class="form-side">

        <div class="form-container">

            <h1>Recuperar senha</h1>

            <p class="subtitle">
                Informe o email utilizado no cadastro.
            </p>

            <div class="message error" th:if="${error}" th:text="${error}"></div>

            <div class="message success" th:if="${success}" th:text="${success}"></div>

            <form th:action="@{/recoverpassword}" method="post">

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        required>
                </div>

                <button class="btn" type="submit">
                    Recuperar acesso
                </button>

            </form>

            <div class="links">
                <a th:href="@{/login}">
                    ← Voltar para o login
                </a>
            </div>

        </div>

    </section>

</div>

</body>
</html>
